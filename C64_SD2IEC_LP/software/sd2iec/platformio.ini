; ===================================================================================
; PlatformIO Project Configuration File
; ===================================================================================
; Project:  SD2IEC - Commodore Floppy Disk Drive Emulator
; Author:   Stefan Wagner
; Year:     2026
; URL:      https://github.com/wagiminator
; ===================================================================================
; Upload via ISP programmer (USBasp). Settings can be changed in config.h.
; The firmware is uploaded without the bootloader (use the makefile for that).
; ===================================================================================

[env:sd2iec]
platform = atmelavr
board = ATmega644P
framework = arduino

board_build.f_cpu   = 8000000L
board_hardware.oscillator = external
board_hardware.bod  = 2.7v
board_hardware.eesave = yes
board_hardware.uart = no_bootloader
board_build.use_lto = yes
upload_protocol = usbasp
upload_flags = -Pusb
build_flags = -I.
